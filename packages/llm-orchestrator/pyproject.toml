[project]
name = "llm-orchestrator"
version = "0.1.0"
description = "Tier-aware model selection, retries and fallbacks over LangChain chat models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-cerebras>=0.8,<0.9",
    "langchain-core>=1.6,<1.7",
    "langchain-google-genai>=4.4,<4.5",
    "langchain-groq>=1.1,<1.2",
    "langchain-ollama>=1.1,<1.2",
    "langchain-openai>=1.7,<1.8",
    "pydantic>=2.9",
    "pyyaml>=6.0,<7",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_orchestrator"]
