[project]
name = "llm-orchestrator"
version = "0.1.0"
description = "Tier-aware model selection, retries and fallbacks over LangChain chat models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0,<7",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_orchestrator"]
