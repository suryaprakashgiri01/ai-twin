[project]
name = "ai-twin"
version = "0.1.0"
description = "Personal knowledge base + portfolio AI twin: FastAPI, LangGraph, RAG, guardrails, observability"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.1",
    "colorama>=0.4; sys_platform == 'win32'", # coloured console logs on Windows terminals
    "httpx>=0.27",
    "pymongo>=4.13", # PyMongo Async API (AsyncMongoClient)
    "beanie>=2.0", # ODM on the PyMongo Async API (Motor is deprecated)
    "redis>=5.2", # works against Valkey too
    "qdrant-client>=1.15",
    "cryptography>=44", # Fernet: blob store and vault archives
    "opentelemetry-api>=1.34,<2", # trace ids on log lines
    "llm-orchestrator", # workspace member: packages/llm-orchestrator
    "python-multipart>=0.0.20",
    "langgraph>=1.2,<1.3", # agent graphs (owner now, public later)
    "dateparser>=1.2", # owner intake: "yesterday", "last Friday", "12 Oct" in OWNER_TIMEZONE
    "tzdata>=2024.1; sys_platform == 'win32'", # zoneinfo data on Windows
    "email-validator>=2.2",
    "aiosmtplib>=3.0",
    "opentelemetry-sdk>=1.34,<2", # a server span per request (trace_id, X-Trace-ID)
    "opentelemetry-exporter-otlp-proto-http>=1.34,<2", # optional OTLP export
    "langfuse>=3.6,<4", # agent traces (Langfuse Cloud Hobby or self-hosted), masked by policy
    "prometheus-client>=0.21", # GET /metrics
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
llm-orchestrator = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "fakeredis>=2.26",
    "types-dateparser>=1.4.3.20260907",
    "aiosmtpd>=1.4",
]
vault = [
    "fastembed>=0.6",
    "markitdown[docx,pptx,xlsx]>=0.1",
    "onnxruntime>=1.20",
    "presidio-analyzer>=2.2",
    "pymupdf4llm>=0.0.17",
    "rapidocr>=3.0",
    "spacy>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "packages/llm-orchestrator/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Vault-only libraries without type information; each is wrapped behind a small typed module.
[[tool.mypy.overrides]]
module = [
    "pymupdf", "pymupdf.*", "pymupdf4llm", "markitdown", "rapidocr", "openpyxl", "pptx",
    "presidio_analyzer", "presidio_analyzer.*", "spacy", "spacy.*", "fastembed", "fastembed.*",
]
ignore_missing_imports = true

# pymupdf ships partial annotations; calls into it are untyped.
[[tool.mypy.overrides]]
module = ["app.kb.ingestion.parsers.pdf", "tests.ingestion.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs the compose stack or downloaded local models (deselect with -m 'not integration')",
]
filterwarnings = [
    # pymupdf's SWIG bindings, raised at import on Python 3.12.
    "ignore:builtin type (SwigPy|swig).* has no __module__ attribute:DeprecationWarning",
    # qdrant-client local mode (unit tests) ignores payload indexes; the server honours them.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

[tool.coverage.run]
source_pkgs = ["app", "llm_orchestrator"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
