[project]
name = "ai-twin"
version = "0.1.0"
description = "Personal knowledge base + portfolio AI twin: FastAPI, LangGraph, RAG, guardrails, observability"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.1",
    "colorama>=0.4; sys_platform == 'win32'",   # coloured console logs on Windows terminals
    "httpx>=0.27",
    "pymongo>=4.13",                            # PyMongo Async API (AsyncMongoClient)
    "redis>=5.2",                               # works against Valkey too
    "opentelemetry-api>=1.34,<2",               # trace ids on log lines; exporters come later
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs the compose stack (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["app", "scripts"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
