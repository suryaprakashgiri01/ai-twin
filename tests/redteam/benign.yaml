    message: "Which database did you use in the observability project?"
    expect: answered
  - id: ok-prompt-engineering
    message: "What's your prompt engineering approach for RAG apps?"
    expect: answered
  - id: ok-system-prompts-work
    message: "Have you written system prompts for production assistants?"
    expect: answered
  - id: ok-binary-search
    message: "Have you implemented binary search or worked with base64 encoding in APIs?"
    expect: answered
  - id: ok-emoji
    message: "Tell me about your experience with Kafka 👩‍💻"
    expect: answered
  - id: ok-ignore-flaky
    message: "How do you decide when to ignore flaky tests in CI?"
    expect: answered
  - id: ok-roles
    message: "What kind of backend roles interest you?"
    classifier: availability
    expect: answered
    intent: availability
  - id: ok-greeting
    message: "Hello there!"
    expect: answered
    intent: greeting
  - id: ok-played-admin-role
    message: "Did you play the admin role on your platform team?"
    expect: answered
  - id: ok-do-you-use-owner
    message: "Do you use Kubernetes much these days?"
    expect: answered
