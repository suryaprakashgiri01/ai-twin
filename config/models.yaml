# Default model inventory for llm-orchestrator. Each model declares `capabilities` (text, tools,
# reasoning) and a `quality` rank (1-5) the gateway uses to fit models to a request's complexity.
# Overrides (kb-storage, admin) may disable a model,
# lower its max_tier or reorder a chain; they can never raise max_tier above the value here.
#
# Tiers: public < private < confidential < restricted. No model may serve restricted, and a model
# that may train on inputs is capped at public. Loading this file enforces both.
#
# Model ids checked against provider docs on 2026-10-17. A free-tier limit left out was not
# published on the provider's docs page at that date (it is shown only in the provider console).
version: 1

models:
  # --- Groq: inputs not retained for training; primary for every role ---------------------
  - id: groq-llama-8b
    provider: groq
    model: llama-3.1-8b-instant
    roles: [router, classifier]
    max_tier: private
    context_window: 131072
    trains_on_inputs: false
    tags: [fast]
    capabilities: [text, tools]
    quality: 2

  - id: groq-gpt-oss-120b
    provider: groq
    model: openai/gpt-oss-120b
    roles: [generator, judge]
    max_tier: private
    context_window: 131072
    trains_on_inputs: false
    free_tier: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}
    tags: [quality]
    capabilities: [text, tools, reasoning]
    quality: 5

  # Llama Prompt Guard 2 (22M): scores public visitor text for injection; replies with a number.
  - id: groq-prompt-guard-2
    provider: groq
    model: meta-llama/llama-prompt-guard-2-22m
    roles: [guard]
    max_tier: public
    context_window: 512
    trains_on_inputs: false
    tags: [fast]
    capabilities: [text]
    quality: 1

  # --- Cerebras: inference inputs and outputs not retained; fallback ------------------------
  - id: cerebras-qwen-27b
    provider: cerebras
    model: qwen-3.8-27b
    roles: [router, classifier]
    max_tier: private
    context_window: 64000
    trains_on_inputs: false
    free_tier: {rpm: 5, tpm: 30000, tpd: 1000000}
    tags: [fast]
    capabilities: [text, tools]
    quality: 3

  - id: cerebras-gpt-oss-120b
    provider: cerebras
    model: gpt-oss-120b
    roles: [generator, judge]
    max_tier: private
    context_window: 65536
    trains_on_inputs: false
    free_tier: {rpm: 5, tpm: 30000, tpd: 1000000}
    tags: [quality]
    capabilities: [text, tools, reasoning]
    quality: 5

  # --- Gemini free tier: inputs used to improve Google's products, so public only ----------
  - id: gemini-flash-lite
    provider: gemini
    model: gemini-3.5-flash-lite
    roles: [router, classifier]
    max_tier: public
    context_window: 1048576
    trains_on_inputs: true
    tags: [fast]
    capabilities: [text, tools]
    quality: 2

  - id: gemini-flash
    provider: gemini
    model: gemini-3.8-flash
    roles: [generator, judge]
    max_tier: public
    context_window: 1048576
    trains_on_inputs: true
    tags: [quality]
    capabilities: [text, tools, reasoning]
    quality: 4

  # --- OpenRouter :free: upstream providers may log or train, so public only ---------------
  - id: openrouter-gemma
    provider: openrouter
    model: google/gemma-4-31b-it:free
    roles: [router, classifier, generator, judge]
    max_tier: public
    context_window: 262144
    trains_on_inputs: true
    free_tier: {rpm: 20, rpd: 50}
    base_url: https://openrouter.ai/api/v1
    capabilities: [text]
    quality: 3

  # --- Ollama (local): the only real model allowed confidential text -----------------------
  # OLLAMA_QUALITY_MODEL / OLLAMA_MODEL replace `model` when set, so any pulled tag can be used.
  # The 7B model writes the answers over confidential context; the 3B one routes and classifies.
  - id: ollama-qwen
    provider: ollama
    model: qwen2.5:7b
    roles: [router, generator, judge]
    max_tier: confidential
    context_window: 32768
    trains_on_inputs: false
    tags: [local, local-quality]
    capabilities: [text, tools]
    quality: 3

  # The strongest local model, pinned by agents that need it (config/agents.yaml: the super
  # agent's confidential steps, via `prefer: local-max`). Last among the local models in the
  # chains, so plain auto mode never waits on it.
  # ~9 GB; fits a 24 GB Mac beside the stack. OLLAMA_MAX_MODEL replaces it.
  - id: ollama-qwen-14b
    provider: ollama
    model: qwen2.5:14b
    roles: [router, generator, judge]
    max_tier: confidential
    context_window: 32768
    trains_on_inputs: false
    tags: [local, local-quality, local-max]
    capabilities: [text, tools]
    quality: 4

  # Qwen3: tool calling and a thinking mode (its thinking is kept out of answers). Disabled until
  # pulled: `make ollama ARGS="pull qwen3:8b"`, then set `enabled: true` (or use the overrides API).
  - id: ollama-qwen3-8b
    provider: ollama
    model: qwen3:8b
    roles: [generator, judge]
    max_tier: confidential
    context_window: 40960
    trains_on_inputs: false
    enabled: false
    tags: [local, local-quality]
    capabilities: [text, tools, reasoning]
    quality: 4

  - id: ollama-qwen3-14b
    provider: ollama
    model: qwen3:14b
    roles: [generator, judge]
    max_tier: confidential
    context_window: 40960
    trains_on_inputs: false
    enabled: false
    tags: [local, local-quality, local-max]
    capabilities: [text, tools, reasoning]
    quality: 5

  - id: ollama-local
    provider: ollama
    model: llama3.2:3b
    roles: [router, classifier, generator, judge]
    max_tier: confidential
    context_window: 131072
    trains_on_inputs: false
    tags: [local]
    capabilities: [text, tools]
    quality: 1

  # --- paid APIs: public and private text only (validation refuses a higher max_tier) --------
  # Disabled until you set the key and flip `enabled` (or enable it in the model overrides).
  # Anthropic needs the optional package: uv add --package llm-orchestrator langchain-anthropic
  - id: anthropic-sonnet
    provider: anthropic
    model: claude-sonnet-5-5
    roles: [router, generator, judge]
    max_tier: private
    context_window: 200000
    trains_on_inputs: false
    cost: {input_per_mtok: 3.0, output_per_mtok: 15.0}
    enabled: false
    tags: [quality, paid]
    capabilities: [text, tools, reasoning]
    quality: 5

  - id: anthropic-opus
    provider: anthropic
    model: claude-opus-5-5
    roles: [generator, judge]
    max_tier: private
    context_window: 200000
    trains_on_inputs: false
    cost: {input_per_mtok: 15.0, output_per_mtok: 75.0}
    enabled: false
    tags: [quality, paid]
    capabilities: [text, tools, reasoning]
    quality: 5

  # Any OpenAI-compatible API: set `model` and `base_url` (omit base_url for OpenAI itself).
  # - id: openai-compatible
  #   provider: openai
  #   model: <model name>
  #   base_url: https://api.example.com/v1
  #   roles: [generator, judge]
  #   max_tier: private
  #   context_window: 128000
  #   trains_on_inputs: false
  #   enabled: false
  #   tags: [quality, paid]

  # --- mock: tests and keyless local runs; available only when LLM_MOCK_ENABLED is true ----
  - id: mock
    provider: mock
    model: mock-echo
    roles: [router, classifier, generator, judge]
    max_tier: confidential
    context_window: 8192
    trains_on_inputs: false
    tags: [local]
    capabilities: [text, tools, reasoning]
    quality: 1

roles:
  router: [groq-llama-8b, cerebras-qwen-27b, gemini-flash-lite, openrouter-gemma, ollama-local, ollama-qwen, mock]
  classifier: [groq-llama-8b, cerebras-qwen-27b, gemini-flash-lite, openrouter-gemma, ollama-local, mock]
  generator: [groq-gpt-oss-120b, cerebras-gpt-oss-120b, gemini-flash, openrouter-gemma, ollama-qwen, ollama-local, ollama-qwen-14b, ollama-qwen3-8b, ollama-qwen3-14b, anthropic-sonnet, anthropic-opus, mock]
  judge: [groq-gpt-oss-120b, cerebras-gpt-oss-120b, gemini-flash, openrouter-gemma, ollama-qwen, ollama-local, ollama-qwen-14b, ollama-qwen3-8b, ollama-qwen3-14b, anthropic-sonnet, anthropic-opus, mock]
  # No fallback: without the guard model the input guard keeps its rule layers and says so.
  guard: [groq-prompt-guard-2]
