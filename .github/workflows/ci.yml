name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - name: Install
        run: uv sync --all-groups --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy app scripts tests packages/llm-orchestrator/src
      - name: Test (coverage gate 80%)
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing:skip-covered

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history for secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  image:
    # The public deployment's image: it builds, holds no data or notes, and the app imports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t ai-twin:ci .
      - name: Nothing private inside
        run: |
          docker run --rm ai-twin:ci sh -c 'for p in /app/vault /app/.env /app/dev-notes /app/tests /app/scripts; do test ! -e "$p" || { echo "found $p"; exit 1; }; done'
      - name: The public app imports and has no admin routes
        run: |
          docker run --rm ai-twin:ci python -c "from app.core.config import Settings; from app.core.app_factory import create_app; paths = set(create_app(Settings(_env_file=None)).openapi()['paths']); assert paths and not any(p.startswith('/admin') for p in paths), 'admin routes mounted'; print(len(paths), 'routes, no admin')"
